<!DOCTYPE html>
<html lang="ja">
<head>

<title>身体機能作業療法評価学実習Ⅱ 第1〜7回 | 確認問題集</title>
<style>
:root{
  --navy-900:#0d1b2e;--navy-800:#14283f;--navy-700:#1b3554;--navy-600:#244469;--navy-100:#e7ecf2;--navy-50:#f2f5f8;
  --gold-700:#8a6d10;--gold-600:#b4900f;--gold-500:#c9a227;--gold-100:#faf2d9;--gold-50:#fdf9ec;
  --ink:#1c1f24;--ink-soft:#565b62;--ink-mute:#8b9099;--line:#e2e5ea;--line-strong:#ccd1d9;
  --page-bg:#f1f2f5;--card-bg:#fff;
  --ok-bg:#e8f3e4;--ok-line:#5e9050;--ok-text:#2c5c22;--bad-bg:#fbe9e8;--bad-line:#c4564f;--bad-text:#8c2c26;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--page-bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.page{max-width:720px;margin:0 auto;padding-bottom:64px}
.masthead{background:linear-gradient(135deg,var(--navy-800),var(--navy-700));color:#fff;padding:26px 20px 22px;position:relative}
.masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold-600),var(--gold-500),var(--gold-600))}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--gold-500);font-weight:700;margin:0 0 4px}
.masthead h1{font-size:21px;margin:0 0 4px;line-height:1.45}
.masthead p{margin:0;font-size:13px;color:#c9d3df}
.card{background:var(--card-bg);margin:18px 14px 0;border-radius:var(--r-lg);padding:22px 20px;box-shadow:0 1px 2px rgba(13,27,46,.06),0 6px 20px rgba(13,27,46,.05);border:1px solid var(--line)}
h2.sec{font-size:15px;margin:0 0 12px;color:var(--navy-700);display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:16px;background:var(--gold-500);border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--navy-50);border:1px solid var(--navy-100);border-radius:var(--r-md);padding:12px 8px;text-align:center}
.stat .num{font-size:24px;font-weight:800;color:var(--navy-700);line-height:1.2}
.stat .lbl{font-size:11.5px;color:var(--ink-soft)}
.stat.weak .num{color:var(--bad-line)}
.stat.master .num{color:var(--ok-line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:1.5px solid var(--line-strong);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
.chip.on{background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.chip .n{font-size:11px;opacity:.75;margin-left:4px}
.row-btns{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mini-link{font-size:12.5px;color:var(--navy-600);background:none;border:none;cursor:pointer;padding:2px 4px;text-decoration:underline;font-family:inherit}
.btn{font-family:inherit;font-size:15px;font-weight:700;border-radius:var(--r-md);padding:13px 18px;cursor:pointer;border:1.5px solid transparent;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.btn-primary{background:var(--navy-700);color:#fff}
.btn-gold{background:var(--gold-500);color:var(--navy-900)}
.btn-ghost{background:#fff;color:var(--navy-700);border-color:var(--line-strong)}
.btn-block{display:block;width:100%;margin-top:10px}
.btn-sub{display:block;font-size:12px;font-weight:500;opacity:.85}
.select-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);margin:6px 0 4px}
.select-row select{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:var(--r-sm);border:1.5px solid var(--line-strong);background:#fff}
.note{font-size:12px;color:var(--ink-mute);margin-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.back-btn{display:inline-flex;align-items:center;gap:4px;background:var(--navy-50);border:1px solid var(--navy-100);color:var(--navy-700);font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:inherit}
.mode-flag{font-size:11.5px;font-weight:700;background:var(--gold-100);color:var(--gold-700);padding:3px 10px;border-radius:999px;border:1px solid #ecd9a0}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.qnum{font-size:13px;font-weight:700;color:var(--ink-soft)}
.catbadge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c1{background:#e3ebf5;color:#244469}.c2{background:#e2f0f2;color:#1d5c66}.c3{background:#e6eef7;color:#2c5d8f}
.c4{background:#e1f2ec;color:#21664f}.c5{background:#fbeadb;color:#8f4b14}.c6{background:#ece8f6;color:#4e3f8c}
.c7{background:#dff0f3;color:#1f6170}.cx{background:var(--gold-100);color:var(--gold-700)}
.progress-track{height:6px;background:var(--navy-100);border-radius:999px;overflow:hidden;margin-bottom:18px}
.progress-fill{height:100%;background:var(--navy-600);border-radius:999px;transition:width .25s}
.progress-fill.is-weak{background:var(--gold-500)}
.question-text{font-size:16.5px;font-weight:700;margin:0 0 16px;line-height:1.75}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:flex;align-items:flex-start;gap:10px;text-align:left;font-family:inherit;font-size:15px;line-height:1.6;background:#fff;border:1.5px solid var(--line-strong);border-radius:var(--r-md);padding:11px 12px;cursor:pointer;color:var(--ink)}
.choice:hover:not([disabled]){border-color:var(--navy-600);background:var(--navy-50)}
.choice .lab{flex:0 0 26px;height:26px;border-radius:50%;background:var(--navy-100);color:var(--navy-700);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.choice.correct{background:var(--ok-bg);border-color:var(--ok-line)}
.choice.correct .lab{background:var(--ok-line);color:#fff}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad-line)}
.choice.wrong .lab{background:var(--bad-line);color:#fff}
.choice[disabled]{cursor:default}
.explain{margin-top:16px;border-left:4px solid var(--navy-600);background:var(--navy-50);border-radius:0 var(--r-md) var(--r-md) 0;padding:12px 14px}
.verdict{font-weight:800;margin:0 0 4px}
.verdict.ok{color:var(--ok-text)}.verdict.bad{color:var(--bad-text)}
.explain p{margin:0;font-size:14px;color:var(--ink)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}
.score-mini{font-size:13px;color:var(--ink-soft);font-weight:700}
.result-hero{background:linear-gradient(135deg,var(--navy-800),var(--navy-700));color:#fff;border-radius:var(--r-lg);padding:22px;text-align:center;position:relative;overflow:hidden}
.result-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold-500)}
.result-hero .big{font-size:40px;font-weight:800;line-height:1.2}
.result-hero .sub{font-size:13px;color:#c9d3df}
.bars{margin-top:18px}
.bar-row{margin-bottom:10px}
.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar-track{height:9px;background:var(--navy-100);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px}
.review-item{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-top:10px;background:#fff}
.ri-q{font-weight:700;font-size:14px;margin:0 0 6px}
.ri-a{font-size:13.5px;color:var(--ok-text);margin:0 0 6px;font-weight:700}
.ri-exp{font-size:13px;color:var(--ink-soft);margin:0}
.ri-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
.miss{font-size:11.5px;color:var(--bad-text);font-weight:700}
details summary{cursor:pointer;font-size:13px;color:var(--navy-600);font-weight:700}
.empty{text-align:center;color:var(--ink-mute);padding:26px 0;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(13,27,46,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:var(--r-lg);padding:22px;max-width:360px;width:100%}
.modal h3{margin:0 0 8px;font-size:16px;color:var(--navy-700)}
.modal p{margin:0 0 16px;font-size:14px;color:var(--ink-soft)}
.modal .btns{display:flex;gap:8px;justify-content:flex-end}
.modal .btn{font-size:14px;padding:10px 14px}
.btn-danger{background:var(--bad-line);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy-800);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:999px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
footer{text-align:center;font-size:11.5px;color:var(--ink-mute);margin-top:22px}
@media (max-width:480px){.masthead h1{font-size:18px}.question-text{font-size:15.5px}.choice{font-size:14.5px}.card{padding:18px 15px;margin:14px 10px 0}.stat .num{font-size:21px}}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <p class="eyebrow">身体機能作業療法評価学実習Ⅱ　第1〜7回</p>
    <h1>反射・筋緊張／脳神経検査／片麻痺の機能回復（BRS・FMA）</h1>
    <p>確認問題集（5択）　東京保健医療専門職大学 作業療法学科　青木 啓一郎</p>
  </header>
  <main id="app"></main>
  <footer>解答履歴はこの端末のブラウザに保存されます</footer>
</div>
<script>
const CATS = [
  { key: "s1", label: "第1回 反射・筋緊張", short: "第1回", cls: "c1" },
  { key: "s2", label: "第2回 脳神経検査", short: "第2回", cls: "c2" },
  { key: "s3", label: "第3回 片麻痺の運動機能", short: "第3回", cls: "c3" },
  { key: "s4", label: "第4回 BRS 上肢", short: "第4回", cls: "c4" },
  { key: "s5", label: "第5回 BRS 手指", short: "第5回", cls: "c5" },
  { key: "s6", label: "第6回 BRS 下肢", short: "第6回", cls: "c6" },
  { key: "s7", label: "第7回 FMA", short: "第7回", cls: "c7" },
  { key: "x",  label: "病態理解・横断的思考", short: "横断", cls: "cx" }
];

const QUESTIONS = [
/* ===================== 第1回 反射・筋緊張 ===================== */
{ id:"s1-01", cat:"s1", q:"腱反射（深部反射）の受容器はどれか。",
  c:["筋紡錘","ゴルジ腱器官（腱紡錘）","パチニ小体","マイスナー小体","自由神経終末"], a:0,
  e:"腱を叩いて筋を急激に伸張すると筋紡錘が興奮し、Ia線維→脊髄→α運動神経→同じ筋が収縮する。受容器（筋紡錘）と効果器（同じ筋）が1対1で対応する単シナプス反射である。" },
{ id:"s1-02", cat:"s1", q:"上腕二頭筋反射の反射中枢はどれか。",
  c:["C5, 6","C6〜8","C8〜Th1","L2〜4","L5〜S2"], a:0,
  e:"上腕二頭筋反射はC5,6（筋皮神経）。上腕三頭筋反射はC6〜8（橈骨神経）、腕橈骨筋反射はC5,6（橈骨神経）、膝蓋腱反射はL2〜4（大腿神経）、アキレス腱反射はL5,S1,2（脛骨神経）。" },
{ id:"s1-03", cat:"s1", q:"上腕三頭筋反射に関与する主な末梢神経はどれか。",
  c:["橈骨神経","筋皮神経","正中神経","尺骨神経","腋窩神経"], a:0,
  e:"上腕三頭筋反射（C6〜8）は橈骨神経。肘関節を半屈曲位にし、肘頭のすぐ上の上腕三頭筋腱を叩いて肘伸展が起これば陽性。" },
{ id:"s1-04", cat:"s1", q:"膝蓋腱反射の反射中枢はどれか。",
  c:["L2〜4","Th12〜L1","L5〜S1","S1, 2","C5, 6"], a:0,
  e:"膝蓋腱反射はL2〜4（大腿神経）。膝窩部を支えて膝蓋骨遠位の膝蓋腱を叩き、大腿四頭筋の収縮で膝が伸展すれば陽性。" },
{ id:"s1-05", cat:"s1", q:"腕橈骨筋反射の検査方法として正しいのはどれか。",
  c:["前腕を回内外中間位にし、橈骨遠位を叩く","前腕を最大回外位にし、尺骨茎状突起を叩く","肘関節を伸展位にし、肘頭のすぐ上を叩く","大胸筋の上腕骨付着部を圧迫して叩く","手掌を検者の指で擦る"], a:0,
  e:"腕橈骨筋反射（C5,6）は前腕を回内外中間位にして橈骨遠位を叩き、肘屈曲が起これば陽性。肘頭上を叩くのは上腕三頭筋反射、大胸筋付着部は胸筋反射、手掌を擦るのは把握反射。" },
{ id:"s1-06", cat:"s1", q:"表在反射の特徴として正しいのはどれか。",
  c:["多シナプス反射で、反応の出現が遅い","単シナプス反射で、反応時間が短い","正常者には出現しない","受容器は筋紡錘である","反応は刺激された筋にのみ出現する"], a:0,
  e:"表在反射は皮膚・粘膜への刺激で起こる一種の逃避反射。多シナプス反射のため①出現が遅い②範囲が広い③加重で増強しうる。正常者にも存在し、減弱・消失は錐体路障害や反射弓の障害を意味する。" },
{ id:"s1-07", cat:"s1", q:"被検者の手部を把持し中指をはじくと、母指が内転・屈曲した。この病的反射はどれか。",
  c:["ホフマン反射","バビンスキー反射","把握反射","腹壁反射","膝クローヌス"], a:0,
  e:"ホフマン反射は中指をはじいて母指が内転・屈曲すれば陽性。上肢の代表的な病的反射で、錐体路障害を示唆する。" },
{ id:"s1-08", cat:"s1", q:"バビンスキー反射の陽性反応はどれか。",
  c:["母趾が伸展する","母趾が屈曲する","足関節が底屈する","足関節が連続的に底背屈する","膝関節が伸展する"], a:0,
  e:"足底の外側縁から母趾方向へ尖ったもので擦り、母趾が伸展すれば陽性。錐体路障害を示唆する代表的な病的反射。足関節の連続的な底背屈は足クローヌス。" },
{ id:"s1-09", cat:"s1", q:"腱反射の記録で「+++」が示すのはどれか。",
  c:["亢進","正常","やや亢進","著明な亢進","軽度減弱"], a:0,
  e:"消失：－（0）、軽度減弱：±、正常：＋、やや亢進：++、亢進：+++、著明な亢進：++++。左右差・上下肢のバランスも含めて記録する。" },
{ id:"s1-10", cat:"s1", q:"腱反射が減弱して見える場合に、両手を組んで左右に強く引かせながら叩打する方法はどれか。",
  c:["イェンドラシック法","対座法","リンネ法","ウェーバー法","振り子運動検査"], a:0,
  e:"イェンドラシック法は反射増強法。注意をそらせる、歯を食いしばらせるなどでも反応が増強されることがある。" },
{ id:"s1-11", cat:"s1", q:"骨格筋を他動的に強く伸張し続けると抵抗感が消失する。この現象に関わる仕組みはどれか。",
  c:["腱紡錘の興奮による自己抑制（Ib抑制）","筋紡錘の興奮による伸張反射","相反神経支配","α－γ連関","連合反応"], a:0,
  e:"ゴルジ腱器官（腱紡錘）は腱に直列に存在し、Ib線維で興奮を伝え、反射性にその筋自身の収縮を抑制する（自己抑制）。折りたたみナイフ現象の説明にも関わる。" },
{ id:"s1-12", cat:"s1", q:"筋紡錘から「持続的な伸張（長さ）」の情報を伝える感覚線維はどれか。",
  c:["II線維","Ia線維","Ib線維","γ運動線維","α運動線維"], a:0,
  e:"筋紡錘のIa線維は急速な伸張（速度）、II線維は持続的な伸張（長さ）を伝える。Ib線維は腱紡錘の感覚線維。" },
{ id:"s1-13", cat:"s1", q:"痙縮の説明として正しいのはどれか。",
  c:["速度依存性に伸張反射が亢進した状態である","伸張速度に関係なく一定の抵抗を示す","錐体外路障害に分類される","歯車現象を伴う","屈筋・伸筋で抵抗の大きさにほとんど差がない"], a:0,
  e:"痙縮は速度依存性の相動性伸張反射亢進で、錐体路障害に分類される。上肢は屈筋、下肢は伸筋に強く出やすい。速度非依存の一定抵抗・歯車現象・屈伸で差がないのは固縮の特徴。" },
{ id:"s1-14", cat:"s1", q:"固縮（rigidity）の特徴として正しいのはどれか。",
  c:["他動運動の始めから終わりまで一定の抵抗を示す","伸張初期に抵抗があり、その後急に消失する","上肢は屈筋、下肢は伸筋に強く出現する","腱反射が著明に亢進する","バビンスキー徴候が明らかに陽性となる"], a:0,
  e:"固縮は伸張速度に関係なく全可動域で一定の抵抗（鉛管様抵抗）を示し、振戦が重なると歯車現象になる。錐体外路障害に分類され、腱反射の亢進はないかわずか。" },
{ id:"s1-15", cat:"s1", q:"MAS（Modified Ashworth Scale）で「引っかかりが明らかで、可動域の1/2以下で若干の抵抗がある」のはどれか。",
  c:["1+","1","2","3","4"], a:0,
  e:"MAS：0 増加なし／1 軽度の増加（引っかかりと消失、または終わりに若干の抵抗）／1+ 引っかかりが明らかで1/2以下で若干の抵抗／2 ほぼ全可動域で増加が明らかだが他動運動は容易／3 かなりの増加で他動運動が困難／4 固まって屈伸できない。" },
{ id:"s1-16", cat:"s1", q:"MASで「ほぼ全可動域で筋緊張の増加が明らかだが、他動運動は容易」に該当するのはどれか。",
  c:["2","1","1+","3","4"], a:0,
  e:"MAS 2は全可動域で増加が明らかだが他動運動は容易。3になると他動運動が困難になる。" },
{ id:"s1-17", cat:"s1", q:"振り子運動検査（Pendulum Test）で筋緊張亢進のときにみられる所見はどれか。",
  c:["振幅が小さく、動きがすぐに停止する","振幅が大きく、持続時間が長い","左右差は生じない","振り子が加速していく","検査速度に関係なく結果は一定である"], a:0,
  e:"緊張低下では動きが大きく持続時間も長い。緊張亢進では振幅が小さく、すぐに停止する。検査速度で結果が変わるため一定の速度で行う。" },
{ id:"s1-18", cat:"s1", q:"錐体外路障害（固縮）の特徴として正しいのはどれか。",
  c:["不随意運動がみられる","腱反射が著明に亢進する","上肢屈筋・下肢伸筋に限局して分布する","明らかな運動麻痺を伴う","折りたたみナイフ現象を示す"], a:0,
  e:"錐体外路障害：鉛管現象・歯車現象、四肢・体幹すべての筋に分布、不随意運動（＋）、腱反射は正常〜軽度亢進、バビンスキー・運動麻痺は（－）または軽度。" },
{ id:"s1-19", cat:"s1", q:"上位運動神経病変の「陰性徴候」はどれか。",
  c:["個々の筋の選択的分離運動の障害","痙縮","クローヌス","連合反応","バビンスキー反射の出現"], a:0,
  e:"陰性徴候（失われるもの）：巧緻動作の障害、筋力低下、選択的分離運動の障害。陽性徴候（現れるもの）：痙縮、腱反射亢進、クローヌス、共同運動・連合反応、病的反射など。" },
{ id:"s1-20", cat:"s1", q:"反射検査の臨床的な実施の考え方として適切なのはどれか。",
  c:["目的を明確にし、必要最小限の検査を実施する","異常があれば直ちに治療プログラムを決定する","興味のある反射はすべて実施する","他の評価結果とは切り離して解釈する","一部分の亢進だけで病変部位を確定する"], a:0,
  e:"反射検査は診断的意義が大きく、直接治療に結びつくことは少ない。画像診断など代替情報を確認し、目的を明確にして必要最小限で行い、筋緊張・感覚・ADLなど他の評価と統合する。" },

/* ===================== 第2回 脳神経検査 ===================== */
{ id:"s2-01", cat:"s2", q:"混合神経（感覚と運動の両方を含む）はどれか。",
  c:["三叉神経","嗅神経","動眼神経","副神経","舌下神経"], a:0,
  e:"感覚神経：I・II・VIII。運動神経：III・IV・VI・XI・XII。混合神経：V（三叉）・VII（顔面）・IX（舌咽）・X（迷走）。" },
{ id:"s2-02", cat:"s2", q:"延髄から出る脳神経はどれか。",
  c:["舌下神経","動眼神経","滑車神経","三叉神経","顔面神経"], a:0,
  e:"大脳・間脳：I・II／中脳：III・IV／橋：V・VI・VII・VIII／延髄：IX・X・XI・XII。" },
{ id:"s2-03", cat:"s2", q:"嗅覚検査にアンモニアなどの刺激臭を用いない理由はどれか。",
  c:["三叉神経を刺激してしまうため","視神経を刺激してしまうため","嗅覚が麻痺して戻らないため","舌咽神経反射が起こるため","嘔吐反射を誘発するため"], a:0,
  e:"刺激臭は三叉神経（鼻粘膜の感覚）を刺激するため、嗅神経の評価にならない。コーヒー・石けんなどを片側の鼻孔ずつ近づけて検査する。" },
{ id:"s2-04", cat:"s2", q:"対座法（confrontation test）について正しいのはどれか。",
  c:["検者の視野を基準にした大まかな検査である","わずかな視野狭窄や盲点の拡大も検出できる","被検者は両眼を開けたまま行う","被検者と検者は約2m離れて向かい合う","上下の2象限のみで判定する"], a:0,
  e:"約80cm離れて向かい合い、被検者は片眼を覆い検者の眼を注視、検者も反対眼を閉じて自分の視野と比べる。4象限で行う大まかな検査で、正確な診断には視野計を用いる。" },
{ id:"s2-05", cat:"s2", q:"下垂体腫瘍で視交叉が障害されたときにみられやすい視野欠損はどれか。",
  c:["両耳側半盲","同名半盲","片眼の全盲","両鼻側半盲","上同名四分盲"], a:0,
  e:"視神経：片眼のみの全盲／視交叉：両耳側半盲（下垂体腫瘍など）／視索〜視放線：同名半盲（脳卒中で多い）。" },
{ id:"s2-06", cat:"s2", q:"同名半盲と半側空間無視の違いとして正しいのはどれか。",
  c:["半側空間無視は自覚に乏しく、対座法が正常でも生じうる","同名半盲は見えない範囲の自覚がない","半側空間無視は対座法で必ず異常となる","同名半盲は頭や眼を動かしても代償できない","両者は同じ病態で区別する必要はない"], a:0,
  e:"同名半盲は欠損を自覚しやすく頭や眼の動きで代償できる。半側空間無視は見えていても注意が向かず自覚に乏しい。対座法が正常でも無視はありうるので、線分二等分・抹消試験も行う。" },
{ id:"s2-07", cat:"s2", q:"右視神経（II）が障害されている。右眼に光を当てたときの反応はどれか。",
  c:["両眼とも縮瞳しない","右眼だけ縮瞳しない","左眼だけ縮瞳しない","両眼とも縮瞳する","両眼とも散瞳する"], a:0,
  e:"視神経は対光反射の求心路。障害側に光を当てても情報が中脳に届かず両眼とも縮瞳しない（健側に光を当てれば両眼とも縮瞳）。動眼神経（遠心路）障害では、どちらに光を当てても障害側だけ縮瞳しない。" },
{ id:"s2-08", cat:"s2", q:"正常な瞳孔の大きさとして正しいのはどれか。",
  c:["2.5〜4.0mm","1.0〜2.0mm","5.0〜6.0mm","6.0〜8.0mm","大きさは左右で異なるのが正常"], a:0,
  e:"正常は2.5〜4.0mm・正円・左右同大。2.5mm未満は縮瞳、5.0mm超は散瞳。急に瞳孔不同が出現し意識が低下したら急変サインとして直ちに報告する。" },
{ id:"s2-09", cat:"s2", q:"外転神経（VI）が支配する外眼筋はどれか。",
  c:["外側直筋","上斜筋","内側直筋","上直筋","下斜筋"], a:0,
  e:"覚え方「LR6・SO4、残りは3」。外側直筋＝外転神経、上斜筋＝滑車神経、それ以外（上直筋・下直筋・内側直筋・下斜筋）＋眼瞼挙筋・瞳孔括約筋＝動眼神経。" },
{ id:"s2-10", cat:"s2", q:"滑車神経麻痺で困難になりやすい生活場面はどれか。",
  c:["階段を降りる","遠くの看板を見る","真横の人を見る","天井を見上げる","匂いを嗅ぐ"], a:0,
  e:"滑車神経が支配する上斜筋は眼球を内下方に向ける。階段を降りるときの視線（内下方）で複視が出やすい。" },
{ id:"s2-11", cat:"s2", q:"右被殻出血でみられやすい眼位はどれか。",
  c:["右（病側）への水平性共同偏視","左（健側）への水平性共同偏視","下内方への偏視（鼻先をにらむ）","左を見ると右眼が内転しない","上方への共同偏視"], a:0,
  e:"被殻出血など橋より上の病変では病側（麻痺と反対側）を見る。橋出血では健側（麻痺側）を見る。視床出血は下内方（鼻先をにらむ）。MLF症候群では側方視で内転障害。" },
{ id:"s2-12", cat:"s2", q:"視床出血でみられやすい眼症状はどれか。",
  c:["下内方への偏視と上方注視障害","病側への水平性共同偏視","健側への水平性共同偏視と著明な縮瞳","側方視時の内転障害","下眼瞼向き垂直性眼振"], a:0,
  e:"視床出血では垂直性共同偏視として下内方を見る（鼻先をにらむ）形をとり、上方注視障害を伴いやすい。" },
{ id:"s2-13", cat:"s2", q:"脳卒中による中枢性顔面神経麻痺の特徴はどれか。",
  c:["額のしわ寄せは両側とも可能である","病巣と同側の顔面が麻痺する","閉眼不全（兎眼）が著明である","額のしわ寄せができない","ベル麻痺が代表的な原因である"], a:0,
  e:"中枢性（核上性）は病巣と反対側の下顔面の麻痺。上顔面（額）を動かす顔面神経核は両側の大脳から支配されるため、額のしわ寄せは保たれ閉眼もほぼ可能。末梢性（ベル麻痺など）は同側で額も動かず兎眼になる。" },
{ id:"s2-14", cat:"s2", q:"舌の前2/3の味覚を担う脳神経はどれか。",
  c:["顔面神経","舌咽神経","三叉神経","舌下神経","迷走神経"], a:0,
  e:"舌の前2/3の味覚は顔面神経（VII）、後方1/3は舌咽神経（IX）。舌の運動は舌下神経（XII）、舌前方の一般感覚は三叉神経（V）第3枝。" },
{ id:"s2-15", cat:"s2", q:"右耳の伝音難聴のときのウェーバー試験の結果はどれか。",
  c:["右（患側）に響く","左（健側）に響く","正中で左右同等に聞こえる","どちらにも聞こえない","左右交互に響く"], a:0,
  e:"ウェーバー試験：正常は正中、伝音難聴は患側に、感音難聴は健側に響く。リンネ試験：正常・感音難聴では気導＞骨導、伝音難聴では骨導≧気導。" },
{ id:"s2-16", cat:"s2", q:"右の舌咽・迷走神経麻痺で「アー」と発声させたときの所見はどれか。",
  c:["口蓋垂が左（健側）へ偏位する","口蓋垂が右（麻痺側）へ偏位する","両側の軟口蓋弓が対称に挙上する","右側の軟口蓋弓のみ挙上する","舌が右へ偏位する"], a:0,
  e:"一側の麻痺では、健側の軟口蓋弓のみ挙上し、口蓋縫線・口蓋垂は健側に引かれて偏位する。" },
{ id:"s2-17", cat:"s2", q:"脳卒中（中枢性）の舌下神経麻痺で挺舌させたときの偏位はどれか。",
  c:["麻痺側（病巣の反対側）へ偏位する","病巣側へ偏位する","偏位はなく萎縮が著明","舌を全く出せない","挺舌時に左右へ交互に揺れる"], a:0,
  e:"中枢性では麻痺側（＝病巣の反対側）へ偏位。末梢性（核・神経）では病変側へ偏位し萎縮・線維束性攣縮を伴う。両側性（ALSなど）では舌を出せない。" },
{ id:"s2-18", cat:"s2", q:"右胸鎖乳突筋の作用として正しいのはどれか。",
  c:["顔を左へ向ける","顔を右へ向ける","右肩を挙上する","頸部を伸展する","下顎を挙上する"], a:0,
  e:"右の胸鎖乳突筋は顔を左へ向ける（反対側への回旋）。副神経（XI）の検査では下顎に抵抗をかけ、胸鎖乳突筋を触診しながら回旋させる。" },
{ id:"s2-19", cat:"s2", q:"副神経麻痺で困難になりやすい生活動作はどれか。",
  c:["洗髪や高い所の物を取る動作","会話の聞き取り","物を噛む動作","瞬きと閉眼","舌での食塊形成"], a:0,
  e:"副神経は上部僧帽筋と胸鎖乳突筋を支配。肩の挙上（更衣・洗髪・高い所の物）や振り向き動作に影響する。障害側の肩・指先が下がる。" },
{ id:"s2-20", cat:"s2", q:"延髄外側症候群（ワレンベルグ症候群）でみられる症状の組み合わせはどれか。",
  c:["同側顔面の温痛覚障害と対側頸部以下の温痛覚障害","同側の動眼神経麻痺と対側の片麻痺","同側の末梢性顔面神経麻痺と対側の片麻痺","両耳側半盲と対側の片麻痺","病側への共同偏視と対側の片麻痺"], a:0,
  e:"ワレンベルグ症候群：同側顔面の温痛覚障害（V）、嚥下障害・嗄声（IX・X）、眼振、対側頸部以下の温痛覚障害、同側のホルネル症候群・小脳失調。動眼神経麻痺＋対側片麻痺はウェーバー症候群（中脳）。" },
{ id:"s2-21", cat:"s2", q:"中脳病変（ウェーバー症候群）でみられるのはどれか。",
  c:["同側の動眼神経麻痺と対側の片麻痺","同側の外転神経麻痺と同側の片麻痺","対側の動眼神経麻痺と対側の片麻痺","同側の舌下神経麻痺のみ","両側の顔面神経麻痺"], a:0,
  e:"中脳病変では同側の動眼神経麻痺（眼瞼下垂・外斜視・散瞳）と対側の片麻痺。脳幹病変は「同側の脳神経麻痺＋対側の片麻痺」（交叉性片麻痺）。" },
{ id:"s2-22", cat:"s2", q:"三叉神経運動枝の障害で開口させたときの所見はどれか。",
  c:["下顎が麻痺側へ偏位する","下顎が健側へ偏位する","口角が麻痺側へ引かれる","舌が健側へ偏位する","開口時に口蓋垂が麻痺側へ偏位する"], a:0,
  e:"奥歯を噛みしめさせて咬筋・側頭筋を触診し、開口させて下顎が麻痺側へ偏位するか、噛み合わせのずれをみる。" },
{ id:"s2-23", cat:"s2", q:"嗅覚障害（I）のある対象者への作業療法の対応として適切なのはどれか。",
  c:["火災・ガス警報器を設置する","聞こえる側から話しかける","行頭に目印をつける","健側から食物を取り込む","片眼遮蔽を行う"], a:0,
  e:"嗅覚障害では焦げ・ガス漏れ・腐敗に気づかない。警報器の設置、調理時のタイマー併用、消費期限の確認習慣などで補う。" },
{ id:"s2-24", cat:"s2", q:"本授業の脳神経検査の実技で、安全と衛生のために定めたルールとして正しいのはどれか。",
  c:["咽頭反射は教員デモのみとし、学生間では行わない","綿棒や舌圧子は洗って再使用する","水飲みは多めの量でむせを確かめる","痛覚用ピンは強く押して確認する","味覚液は同じ綿棒で全員に使う"], a:0,
  e:"綿棒・舌圧子・ピンは1人1回で廃棄。咽頭反射は教員デモのみ。ピンは皮膚を傷つけない強さ、水飲みはごく少量でむせたら中止。" },

/* ===================== 第3回 片麻痺の運動機能 ===================== */
{ id:"s3-01", cat:"s3", q:"皮質脊髄路の大部分の線維が反対側へ交叉する部位はどれか。",
  c:["延髄","内包","中脳","橋","頸髄"], a:0,
  e:"延髄下部の錐体交叉で大部分の線維が反対側へ交叉するため、病巣と反対側に麻痺が生じる（右半球の損傷→左片麻痺）。" },
{ id:"s3-02", cat:"s3", q:"内包の病巣で、小さな病巣でも広い範囲の麻痺が生じやすい理由はどれか。",
  c:["運動線維が密集して通過する部位だから","錐体交叉が起こる部位だから","下位運動ニューロンの細胞体があるから","感覚線維だけが通る部位だから","左右両方の大脳から支配を受けるから"], a:0,
  e:"内包（後脚）は大脳皮質からの線維が密集する部位のため、小さな病巣でも上下肢に広く麻痺が生じる。" },
{ id:"s3-03", cat:"s3", q:"下位運動ニューロン障害の特徴はどれか。",
  c:["筋萎縮が著明である","腱反射が亢進する","バビンスキー反射が出現する","運動のパターンが障害される","痙縮がみられる"], a:0,
  e:"下位運動ニューロン障害：筋緊張低下（弛緩）、腱反射低下・消失、病的反射なし、筋萎縮著明、線維束攣縮あり、支配される筋ごとに麻痺。上位運動ニューロン障害は亢進・病的反射・パターンの障害。" },
{ id:"s3-04", cat:"s3", q:"脳卒中の発症直後の筋緊張と腱反射の状態として多いのはどれか。",
  c:["弛緩性で腱反射が低下している","痙縮が最も強い","固縮がみられる","腱反射が著明に亢進している","クローヌスが持続する"], a:0,
  e:"上位運動ニューロン障害でも発症直後は弛緩性で腱反射が低下していることが多い。その後、痙縮が現れてくる。" },
{ id:"s3-05", cat:"s3", q:"上位運動ニューロン障害の陽性徴候はどれか。",
  c:["連合反応","筋力低下","巧緻性の低下","分離運動の障害","易疲労性"], a:0,
  e:"陽性徴候（新たに現れる）：痙縮・腱反射亢進、連合反応、共同運動、病的反射。陰性徴候（失われる）：筋力低下、巧緻性低下、分離運動の障害、易疲労性。" },
{ id:"s3-06", cat:"s3", q:"上位の中枢による抑制が弱まり、下位の中枢がもつ反射や原始的な運動パターンが現れることを何というか。",
  c:["解放現象","相反神経支配","自己抑制","レイミステ反応","テノデーシス"], a:0,
  e:"大脳皮質の「ブレーキ」が外れると、脳幹・脊髄のもつ反射が表に出る（解放現象）。伸張反射の亢進→痙縮、決まったパターン→共同運動、努力による波及→連合反応、頭の向き・姿勢→姿勢反射。" },
{ id:"s3-07", cat:"s3", q:"片麻痺の痙縮が強く出やすい筋群の組み合わせはどれか。",
  c:["上肢は屈筋、下肢は伸筋","上肢は伸筋、下肢は屈筋","上肢・下肢ともに屈筋","上肢・下肢ともに伸筋","四肢・体幹すべての筋で同程度"], a:0,
  e:"痙縮は上肢は屈筋、下肢は伸筋に強く出やすい。四肢・体幹で同程度なのは固縮の特徴。" },
{ id:"s3-08", cat:"s3", q:"痙縮を評価するときの注意として適切なのはどれか。",
  c:["いつも同じ姿勢・同じ速さで行い、1回目の反応を大切にする","速さを毎回変えて最も弱い抵抗を記録する","何度もくり返し、慣れた後の反応を記録する","寒い部屋で覚醒を下げてから行う","姿勢は毎回変えて最も強い抵抗を記録する"], a:0,
  e:"痙縮は姿勢・覚醒・痛み・不安・寒さで変わる。同じ姿勢・同じ速さで行い、くり返すと反応が変わるため1回目の反応を大切にする。" },
{ id:"s3-09", cat:"s3", q:"片麻痺の運動機能をMMTではなくBRSで評価する主な理由はどれか。",
  c:["共同運動のため、1つの関節だけを単独で動かせないから","片麻痺では筋力が必ず正常だから","MMTは上肢にしか使えないから","BRSのほうが検査時間が長いから","片麻痺では姿勢による変化がないから"], a:0,
  e:"MMTは1つの筋（関節）を単独で動かせること、肢位で筋力が変わらないことが前提。片麻痺では共同運動のため単独で動かせず、姿勢や頭の向きで筋緊張が変わるため、運動パターンの質で段階を評価する（BRS）。" },
{ id:"s3-10", cat:"s3", q:"ブルンストローム・ステージで痙縮が最も強くなる段階はどれか。",
  c:["ステージIII","ステージI","ステージII","ステージV","ステージVI"], a:0,
  e:"回復過程：I 弛緩（痙縮少ない）→ II 連合反応 → III 共同運動（痙縮が最も強い）→ IV 分離開始 → V 分離が進む → VI ほぼ正常（痙縮はしだいに減る）。" },
{ id:"s3-11", cat:"s3", q:"片麻痺の回復過程の特徴として正しいのはどれか。",
  c:["中枢部から末梢部へ回復しやすい","段階を飛び越えて回復することが多い","いったん始まった回復は必ず最後まで進む","回復の多くは発症から数年後に起こる","初期の麻痺が重いほど回復が大きい"], a:0,
  e:"回復は順番に進み飛び越えにくく、どの段階でも止まりうる。中枢部から末梢部へ回復しやすく、多くは発症から数か月以内（数週〜3か月ごろに大きく回復）。初期の麻痺が重いほど回復は限られやすい。" },
{ id:"s3-12", cat:"s3", q:"発症早期に少しでもできると、上肢機能が回復しやすいと報告されている動きの組み合わせはどれか。",
  c:["手指の随意的な伸展と肩の外転","手指の屈曲と肘の屈曲","肩甲骨の挙上と肘の屈曲","前腕の回外と手関節の掌屈","肩の内旋と前腕の回内"], a:0,
  e:"発症早期に手指の随意的な伸展と肩の外転が少しでもできる人は、上肢機能が回復しやすいと報告されている（いずれも共同運動から外れた要素）。" },
{ id:"s3-13", cat:"s3", q:"連合反応について正しいのはどれか。",
  c:["BRSステージIIの判定根拠となる","麻痺側に意図した運動が起こることをいう","非麻痺側の動きは影響しない","日常生活には影響しない","ステージVIで最も強く出る"], a:0,
  e:"連合反応は身体のある部分の強い随意運動や努力によって、麻痺側に意図しない筋収縮・運動が起こること。ステージIIの判定根拠で、生活では「力むと腕が曲がる」原因になる。" },
{ id:"s3-14", cat:"s3", q:"非麻痺側の股・膝の屈曲に抵抗をかけたときに、麻痺側下肢に出る連合反応はどれか。",
  c:["伸展（相反性）","屈曲（対称性）","内転","外旋","反応は出ない"], a:0,
  e:"上肢は「同じ動き」（対称性：非麻痺側肘屈曲→麻痺側も屈曲）。下肢の屈伸は「逆の動き」（相反性：非麻痺側屈曲→麻痺側伸展）。股の内転・外転は同じ動き（レイミステ反応）。" },
{ id:"s3-15", cat:"s3", q:"レイミステ反応を誘発するために抵抗をかける運動はどれか。",
  c:["非麻痺側の股関節内転・外転","非麻痺側の肘屈曲","非麻痺側の握り","麻痺側の膝伸展","頸部の回旋"], a:0,
  e:"レイミステ反応：非麻痺側の股内転・外転に抵抗をかけると、麻痺側も同じ方向へ動く。" },
{ id:"s3-16", cat:"s3", q:"上肢の屈筋共同運動の構成要素はどれか。",
  c:["前腕回外","肩関節内旋","肩甲骨前方突出","肘関節伸展","前腕回内"], a:0,
  e:"上肢屈筋共同運動：肩甲骨挙上・後退、肩屈曲・外転・外旋、肘屈曲、前腕回外、手関節掌屈・手指屈曲。伸筋共同運動：肩甲骨前方突出、肩伸展・内転・内旋、肘伸展、前腕回内。" },
{ id:"s3-17", cat:"s3", q:"上肢の伸筋共同運動で、前腕にみられる運動はどれか。",
  c:["回内","回外","中間位保持","橈屈","尺屈"], a:0,
  e:"伸筋共同運動では前腕は回内。「手を反対側の膝へ」で観察する。" },
{ id:"s3-18", cat:"s3", q:"ブルンストロームによる屈筋共同運動で最も強い要素はどれか。",
  c:["肘関節屈曲","肩甲骨挙上","肩関節外転","肩関節外旋","前腕回外"], a:0,
  e:"屈筋共同運動で最も強い要素は肘屈曲、伸筋共同運動で最も強い要素は大胸筋（肩内転・内旋）。肩の外転・外旋、肘伸展は弱く出にくい。" },
{ id:"s3-19", cat:"s3", q:"上肢の伸筋共同運動で最も強く出る要素はどれか。",
  c:["大胸筋による肩内転・内旋","肘関節伸展","前腕回内","肩甲骨前方突出","手関節背屈"], a:0,
  e:"伸筋共同運動の最も強い要素は大胸筋（肩内転・内旋）。肘伸展は弱く出にくい。" },
{ id:"s3-20", cat:"s3", q:"下肢の伸筋共同運動で、足関節にみられる運動はどれか。",
  c:["底屈・内がえし","背屈・内がえし","背屈・外がえし","底屈・外がえし","中間位"], a:0,
  e:"下肢屈筋共同運動：股屈曲・外転・外旋、膝屈曲、足背屈・内がえし、足趾伸展。伸筋共同運動：股伸展・内転・内旋、膝伸展、足底屈・内がえし、足趾屈曲。下肢では伸筋共同運動が優位になりやすい。" },
{ id:"s3-21", cat:"s3", q:"片麻痺に多い肢位（ウェルニッケ・マン肢位）の下肢として正しいのはどれか。",
  c:["股伸展・内転、膝伸展、足関節底屈・内反","股屈曲・外転、膝屈曲、足関節背屈","股伸展・外転、膝屈曲、足関節外反","股屈曲・内転、膝伸展、足関節背屈","股外旋、膝屈曲、足関節中間位"], a:0,
  e:"ウェルニッケ・マン肢位：上肢は肩内転・内旋、肘屈曲、前腕回内、手関節・手指屈曲。下肢は股伸展・内転、膝伸展、足底屈・内反。歩行時に足先が引っかかる（分回し歩行）。" },
{ id:"s3-22", cat:"s3", q:"非対称性緊張性頸反射（ATNR）で、顔を向けた側の上肢に起こるのはどれか。",
  c:["伸展","屈曲","内旋","変化なし","振戦"], a:0,
  e:"ATNR：顔を向けた側の上下肢が伸展、後頭側が屈曲。評価では頭を正中にそろえる。" },
{ id:"s3-23", cat:"s3", q:"対称性緊張性頸反射（STNR）で頸部を屈曲したときの反応はどれか。",
  c:["上肢屈曲・下肢伸展","上肢伸展・下肢屈曲","上下肢とも屈曲","上下肢とも伸展","顔側の上下肢伸展"], a:0,
  e:"STNR：頸部屈曲で上肢屈曲・下肢伸展、頸部伸展で上肢伸展・下肢屈曲。" },
{ id:"s3-24", cat:"s3", q:"緊張性迷路反射について正しいのはどれか。",
  c:["背臥位で伸筋、腹臥位で屈筋の緊張が高まる","背臥位で屈筋、腹臥位で伸筋の緊張が高まる","頭の回旋で顔側の上下肢が伸展する","足底への接地で下肢が伸展して固まる","頸部屈曲で上肢屈曲・下肢伸展する"], a:0,
  e:"緊張性迷路反射は背臥位／腹臥位で反応する。足底接地で下肢が伸展して固まるのは陽性支持反応。" },
{ id:"s3-25", cat:"s3", q:"「杖を非麻痺側で強く握って歩くと、麻痺側の肘が曲がってくる」。この現象はどれか。",
  c:["連合反応","伸筋共同運動","緊張性迷路反射","陽性支持反応","分離運動"], a:0,
  e:"非麻痺側の強い努力で麻痺側に意図しない運動が起こる＝連合反応。生活では杖を強く握る・急いで歩く・緊張すると麻痺側の腕が曲がる。" },
{ id:"s3-26", cat:"s3", q:"「肘を速く伸ばすと強い抵抗があり、途中で急に抵抗が抜ける」。この現象はどれか。",
  c:["折りたたみナイフ現象","歯車現象","鉛管様抵抗","パラトニア","クローヌス"], a:0,
  e:"折りたたみナイフ現象は痙縮でみられる、伸張初期に抵抗があり急に消失する現象。" },
{ id:"s3-27", cat:"s3", q:"共同運動が生活の中で「使える」場面の例はどれか。",
  c:["下肢の伸展パターンで立位を支える","前の物に手を伸ばす","袖に腕を通す","細かいボタン操作をする","前方の物を肘を伸ばして取る"], a:0,
  e:"使える場面：屈筋共同運動で物を体に引き寄せる、伸筋共同運動で机上の物を押さえる、下肢の伸展パターンで立位を支える。リーチや袖通しではパターンがじゃまになる。" },

/* ===================== 第4回 BRS 上肢 ===================== */
{ id:"s4-01", cat:"s4", q:"BRS上肢ステージIVの課題はどれか。",
  c:["肘90°屈曲位で前腕の回内・回外","側方水平挙上（肘伸展）","前方から頭上へ挙上","肘伸展位で前腕の回内・回外","手を口へ"], a:0,
  e:"IV：①手を腰の後ろへ ②前方水平挙上（肘伸展）③肘90°屈曲位で回内・回外。V：①側方水平挙上（肘伸展）②前方から頭上へ挙上 ③肘伸展位で回内・回外。" },
{ id:"s4-02", cat:"s4", q:"BRS上肢ステージVの課題はどれか。",
  c:["側方水平挙上（肘伸展）","手を腰の後ろへ","前方水平挙上（肘伸展）","手を反対側の膝へ","肘90°屈曲位で回内・回外"], a:0,
  e:"Vは「体から離れて・90°以上」の課題：側方水平挙上、前方から頭上へ挙上、肘伸展位での回内・回外。" },
{ id:"s4-03", cat:"s4", q:"共同運動を随意に起こせるが、分離運動ができない段階はどれか。",
  c:["ステージIII","ステージI","ステージII","ステージIV","ステージV"], a:0,
  e:"III：共同運動を随意に起こせる（屈筋：手を口へ／伸筋：手を反対側の膝へ）。IVから共同運動から外れた課題（分離）が出てくる。" },
{ id:"s4-04", cat:"s4", q:"BRS上肢ステージIIの状態はどれか。",
  c:["共同運動またはその要素が連合反応としてわずかに出る","随意運動がない（弛緩）","共同運動を随意に起こせる","手を腰の後ろへ回せる","各関節の分離運動が自由にできる"], a:0,
  e:"I：随意運動なし（弛緩）／II：連合反応としてわずかに出る／III：共同運動を随意に／IV・V：分離課題／VI：分離運動が自由で速さ・協調性もほぼ正常。" },
{ id:"s4-05", cat:"s4", q:"BRS上肢の判定手順として正しいのはどれか。",
  c:["上のステージの課題から確認する（V→IV→III）","必ずIから順に全課題を行う","課題は口頭だけで説明する","臥位で行う","背もたれに寄りかかった姿勢で行う"], a:0,
  e:"座位で背もたれに寄りかからない姿勢をとり、課題をデモで示し非麻痺側で一度やってもらう。V→IV→IIIの順に確認し、上位課題ができれば下位は省略可。できなければ連合反応（II）を確認。" },
{ id:"s4-06", cat:"s4", q:"BRS上肢で、そのステージと判定する基準として正しいのはどれか。",
  c:["そのステージの課題のうち1つ以上できればよい","そのステージの課題がすべてできる必要がある","2つ以上できればよい","最も簡単な課題ができればよい","課題の速さが正常であればよい"], a:0,
  e:"各ステージの課題のうち1つ以上できればそのステージと判定する。" },
{ id:"s4-07", cat:"s4", q:"BRS上肢の判定で見抜くべき代償運動はどれか。",
  c:["体幹の側屈・後傾で腕を上げる","非麻痺側でデモを確認する","肘を伸ばしたまま挙上する","肘を体側につけたまま回内・回外する","座位で背筋を伸ばす"], a:0,
  e:"代償運動：体幹の側屈・後傾で腕を上げる、肩甲帯の挙上でごまかす、重力を利用して回内・回外する。" },
{ id:"s4-08", cat:"s4", q:"ステージIV-①「手を腰の後ろへ」の判定の目安はどれか。",
  c:["手背が仙骨部に届く","手掌が反対側の肩に届く","手が頭上に届く","手が口に届く","手が反対側の膝に届く"], a:0,
  e:"IV-①は手背が仙骨部に届くかをみる（背面から観察）。" },
{ id:"s4-09", cat:"s4", q:"ステージIV-③「肘90°屈曲位での回内・回外」の注意点はどれか。",
  c:["肘を体側から離さない","肘を伸ばしたまま行う","肩を90°外転して行う","肘を体側から離して行う","重力を利用して回す"], a:0,
  e:"IV-③は肘を体側につけて90°屈曲位で回内・回外。肘が体側から離れると肩の回旋で代償できてしまう。" },
{ id:"s4-10", cat:"s4", q:"「肘を伸ばしたまま前方水平まで挙げられるが、頭上までは挙がらない」。上肢ステージはどれか。",
  c:["IV","II","III","V","VI"], a:0,
  e:"前方水平挙上（肘伸展）はIV-②。前方から頭上への挙上（V-②）ができないためIV。" },
{ id:"s4-11", cat:"s4", q:"「肘を曲げようとすると肩が外転・外旋し前腕も回外する。肘だけは曲げられない」。上肢ステージはどれか。",
  c:["III","II","IV","V","I"], a:0,
  e:"動かそうとすると必ず屈筋共同運動のパターンになり、分離ができない＝III。" },
{ id:"s4-12", cat:"s4", q:"「非麻痺側で強く握ると麻痺側の大胸筋が収縮する。自分では動かせない」。上肢ステージはどれか。",
  c:["II","I","III","IV","V"], a:0,
  e:"自分では動かせないが、連合反応として共同運動の要素がわずかに出る＝II。動きが見えなくても触って収縮を確かめる。" },
{ id:"s4-13", cat:"s4", q:"「肘を伸ばしたまま側方水平まで挙上できるが、動きがぎこちなく遅い」。上肢ステージはどれか。",
  c:["V","IV","III","VI","II"], a:0,
  e:"側方水平挙上（V-①）ができるのでV以上。速さ・協調性がほぼ正常でないためVIではなくV。" },
{ id:"s4-14", cat:"s4", q:"ステージIVとVの課題の覚え方として正しいのはどれか。",
  c:["IVは体の近く・90°まで、Vは体から離れて・90°以上","IVは体から離れて、Vは体の近く","IVは臥位、Vは座位","IVは肘屈曲のみ、Vは肘伸展のみ","IVは非麻痺側、Vは麻痺側で行う"], a:0,
  e:"IVは「体の近く・90°まで」、Vは「体から離れて・90°以上」。" },
{ id:"s4-15", cat:"s4", q:"BRS上肢の記録として適切なのはどれか。",
  c:["ステージだけでなく、できた課題と角度、疼痛・亜脱臼の有無も残す","ステージの数字だけを記録する","代償があっても記録しない","最も悪かった試行のみ記録する","疼痛は記録の対象外とする"], a:0,
  e:"ステージだけでなく、できた課題と角度、疼痛・肩の亜脱臼の有無を記録する。実技では「可・不十分・不可」と代償も記入。" },

/* ===================== 第5回 BRS 手指 ===================== */
{ id:"s5-01", cat:"s5", q:"BRS手指ステージIIIの状態はどれか。",
  c:["全指の集団屈曲・鉤形握りは可能だが、随意的な伸展はできない","横つまみが可能","対向つまみが可能","指の個別運動が可能","自動的な手指屈曲がわずかに可能"], a:0,
  e:"手指：I 弛緩／II 自動的な手指屈曲がわずか／III 集団屈曲・鉤形握り可、随意伸展不可／IV 横つまみ、母指の動きで離せる、伸展が半随意的にわずか／V 対向つまみ・円筒握り・球握り、随意的な集団伸展／VI すべての握り、全可動域の伸展、個別運動。" },
{ id:"s5-02", cat:"s5", q:"BRS手指ステージIVの特徴はどれか。",
  c:["横つまみが可能","集団屈曲のみ可能","球握りが可能","指の個別運動が可能","弛緩している"], a:0,
  e:"IVは横つまみが可能で、母指の動きで離せる。指の伸展が半随意的にわずかに可能。" },
{ id:"s5-03", cat:"s5", q:"随意的な集団伸展が可能になるステージはどれか。",
  c:["V","II","III","IV","VI"], a:0,
  e:"Vで随意的な集団伸展が可能（範囲は一定しない）。IVでは半随意的にわずか、VIで全可動域の伸展。" },
{ id:"s5-04", cat:"s5", q:"指の個別運動が可能になるステージはどれか。",
  c:["VI","III","IV","V","II"], a:0,
  e:"VIですべての握りが可能、全可動域の伸展、指の個別運動が可能。最後に指折り・母指と各指の対立で確認する。" },
{ id:"s5-05", cat:"s5", q:"コインを母指と示指の指腹でつまむ握りはどれか。",
  c:["対向つまみ","横つまみ","鉤形握り","円筒握り","球握り"], a:0,
  e:"対向つまみ（V）：母指と示指の指腹でつまむ（コイン）。横つまみ（IV）：母指と示指の側面ではさむ（カード）。" },
{ id:"s5-06", cat:"s5", q:"カードを母指と示指の側面ではさむ横つまみが該当するステージはどれか。",
  c:["IV","III","V","VI","II"], a:0,
  e:"鉤形握り＝III、横つまみ＝IV、対向つまみ・円筒握り・球握り＝V。" },
{ id:"s5-07", cat:"s5", q:"鉤形握りの例として適切なのはどれか。",
  c:["バッグの取っ手を持つ","コインをつまむ","コップを持つ","ボールをつかむ","カードをはさむ"], a:0,
  e:"鉤形握り（III）は指を鉤のように曲げる握り（バッグの取っ手）。離せるかも確認する。" },
{ id:"s5-08", cat:"s5", q:"BRS手指の判定手順として正しいのはどれか。",
  c:["前腕を机にのせ、握る→開くの順に確認する","前腕を空中に保持して行う","最初に指折りを確認する","ボール→コップ→コイン→カードの順に提示する","開けなくても握れればVとする"], a:0,
  e:"座位で前腕を机にのせ手関節を安定させる。握る→開くの順（開けるかが分かれ目）。カード→コイン→コップ→ボールの順に提示し、最後に指折り・母指と各指の対立（VI）。" },
{ id:"s5-09", cat:"s5", q:"BRS手指の判定で区別すべき動きはどれか。",
  c:["手関節屈曲で指が開くテノデーシス様の動き","母指と示指で横つまみする動き","手掌全体で円柱を握る動き","指を鉤のように曲げる動き","指を広げて球を包む動き"], a:0,
  e:"手関節を屈曲すると腱の作用で指が受動的に開く（テノデーシス様）。随意的な伸展と区別する。握ったまま離せないときは無理に開かせない。" },
{ id:"s5-10", cat:"s5", q:"手指ステージIIIで起こりやすい生活上の問題はどれか。",
  c:["握った物を離せない","物をつかめない","指を1本ずつ動かせない","浮腫が出ない","痛みが出ない"], a:0,
  e:"IIIは握れるが随意的に開けないため、物を離せず持たせにくい。押さえる・ひっかけて運ぶなど補助手の一部として使う。" },
{ id:"s5-11", cat:"s5", q:"「コップやボトルを持てる。両手動作で使えるが、速さ・巧緻性は不十分」。手指ステージの目安はどれか。",
  c:["V","III","IV","VI","II"], a:0,
  e:"生活での目安：I・II 使えない（管理中心）／III 押さえる・ひっかける／IV 横つまみで軽い物（紙・カード）／V コップやボトル、両手動作／VI ボタン・箸など細かい動作。" },
{ id:"s5-12", cat:"s5", q:"手指ステージと実際の手の使用について正しいのはどれか。",
  c:["感覚障害・高次脳機能・習慣でも変わるため、ステージだけで決めつけない","ステージが同じなら使用状況は必ず同じである","ステージVなら箸を必ず使える","ステージIIIなら必ず実用手になる","感覚障害は手の使用に影響しない"], a:0,
  e:"実際の使用は感覚障害・高次脳機能・習慣でも変わる。ステージは目安であり、生活場面で確認する。" },
{ id:"s5-13", cat:"s5", q:"テニスボールを使って確認する握りはどれか。",
  c:["球握り","円筒握り","対向つまみ","横つまみ","鉤形握り"], a:0,
  e:"物品：カード（横つまみ）、コイン（対向つまみ）、コップ・円柱（円筒握り）、テニスボール（球握り）。球握りは指を広げて包めるかをみる。" },

/* ===================== 第6回 BRS 下肢 ===================== */
{ id:"s6-01", cat:"s6", q:"BRS下肢ステージIIIの状態はどれか。",
  c:["座位・立位で股・膝・足関節の同時屈曲","座位で踵をつけたまま足関節背屈","立位で股伸展位のまま膝屈曲","随意運動なし（弛緩）","立位で骨盤挙上を超えた股関節外転"], a:0,
  e:"下肢：I 弛緩／II わずかな随意運動（連合反応含む）／III 座位・立位で股・膝・足の同時屈曲／IV 座位の分離課題／V 立位の分離課題／VI 立位の股外転・座位の下腿内外旋。" },
{ id:"s6-02", cat:"s6", q:"BRS下肢ステージIVの課題はどれか。",
  c:["座位で踵をつけたまま足関節背屈","立位で股伸展位の膝屈曲","立位で股関節外転","座位で下腿の内外旋","股・膝・足の同時屈曲"], a:0,
  e:"IV：①座位で膝を90°以上曲げ、足を床の後方へすべらせる ②座位で踵をつけたまま足関節背屈。" },
{ id:"s6-03", cat:"s6", q:"BRS下肢ステージVの課題はどれか。",
  c:["立位で膝伸展位のまま、足を前に出して足関節背屈","座位で膝を90°以上屈曲","立位で骨盤挙上を超えた股関節外転","随意運動がわずか","同時屈曲"], a:0,
  e:"V：①立位で股関節伸展位のまま膝屈曲 ②立位で膝を伸ばしたまま足を前に出して足関節背屈。" },
{ id:"s6-04", cat:"s6", q:"BRS下肢ステージVIの課題はどれか。",
  c:["座位で下腿の内旋・外旋（足の内がえし・外がえしを伴う）","座位で踵をつけたまま足関節背屈","立位で股伸展位の膝屈曲","座位で膝を90°以上屈曲","股・膝・足の同時屈曲"], a:0,
  e:"VI：①立位で骨盤挙上の範囲を超えた股関節外転 ②座位で下腿の内旋・外旋（足の内がえし・外がえしを伴う）。" },
{ id:"s6-05", cat:"s6", q:"BRS下肢で立位の課題を行うときの検者の位置として適切なのはどれか。",
  c:["麻痺側の後方","非麻痺側の前方","正面から離れて観察","非麻痺側の後方","位置は問わない"], a:0,
  e:"検者は麻痺側の後方に立ち、手は骨盤と体幹に。つかまる台・平行棒、滑らない靴を準備する。" },
{ id:"s6-06", cat:"s6", q:"BRS下肢の評価の進め方として正しいのはどれか。",
  c:["座位の課題で不安定なら、立位の課題は行わない","立位の課題から先に行う","立位では記録役は介助に入らない","床に物を置いて目印にする","裸足で行う"], a:0,
  e:"座位→立位の順に行う。座位の課題で不安定なら立位は行わない。立位では記録役も介助に入り2人で守る。床に物を置かず、上履き・動きやすい服装で。" },
{ id:"s6-07", cat:"s6", q:"BRS下肢ステージVの課題の特徴として正しいのはどれか。",
  c:["屈筋と伸筋のパターンを組み合わせる動きである","屈筋共同運動のみで行える","伸筋共同運動のみで行える","臥位で行う","連合反応で判定する"], a:0,
  e:"Vの課題は屈筋と伸筋のパターンを組み合わせる動き（股伸展＋膝屈曲、膝伸展＋足背屈）。" },
{ id:"s6-08", cat:"s6", q:"IV-①「座位で膝を90°以上曲げ、足を後方へ」の判定の注意点はどれか。",
  c:["足部は床をすべらせる","足を床から浮かせて行う","立位で行う","股関節を外転させて行う","踵を床から離さない"], a:0,
  e:"IV-①は足部を床の上ですべらせて後方へ。IV-②は踵を床から離さずに足関節背屈。" },
{ id:"s6-09", cat:"s6", q:"V-①「立位で股伸展位のまま膝屈曲」の判定の注意点はどれか。",
  c:["股関節を曲げない","膝を伸ばしたまま行う","骨盤を挙上して行う","座位で行う","足を前に出して行う"], a:0,
  e:"V-①は股関節を曲げずに（伸展位のまま）膝だけ屈曲。股関節が曲がると屈筋共同運動になる。" },
{ id:"s6-10", cat:"s6", q:"BRS下肢の立位評価が作業療法にとってもつ意味として適切なのはどれか。",
  c:["トイレ・更衣・入浴での立位保持や移乗時の支持に関係する","歩行速度のみを判定する","上肢機能とは無関係に作業ができる","安全配慮は不要である","OTは立位を評価しない"], a:0,
  e:"トイレ・更衣・入浴での立位保持、台所など立位での作業、移乗時の麻痺側下肢の支持につながる。" },
{ id:"s6-11", cat:"s6", q:"VI-①「立位での股関節外転」の判定の注意点はどれか。",
  c:["骨盤の挙上だけで上げない","踵を床につけたまま行う","膝を曲げて行う","座位で行う","骨盤を挙上して代償させる"], a:0,
  e:"VI-①は骨盤挙上の範囲を超えた股関節外転。骨盤の挙上だけで上げていないかをみる。" },

/* ===================== 第7回 FMA ===================== */
{ id:"s7-01", cat:"s7", q:"FMA上肢運動項目の満点はどれか。",
  c:["66点","34点","57点","100点","226点"], a:0,
  e:"運動機能：上肢66点（A肩・肘・前腕36、B手関節10、C手14、D協調性・速さ6）＋下肢34点（E股・膝・足28、F協調性6）＝100点。感覚・バランス・関節可動域と痛みを含む全体は226点。" },
{ id:"s7-02", cat:"s7", q:"FMA下肢運動項目の満点はどれか。",
  c:["34点","28点","66点","100点","36点"], a:0,
  e:"下肢はE股・膝・足28点＋F協調性・速さ6点＝34点。" },
{ id:"s7-03", cat:"s7", q:"FMA全体（感覚・バランス・関節可動域と痛みを含む）の満点はどれか。",
  c:["226点","100点","66点","124点","150点"], a:0,
  e:"運動機能100点のほかに感覚・バランス・関節可動域と痛みの項目があり、全体で226点。" },
{ id:"s7-04", cat:"s7", q:"FMA上肢A（肩・肘・前腕）の配点はどれか。",
  c:["36点","10点","14点","6点","28点"], a:0,
  e:"上肢A 36点（反射4・屈筋共同運動12・伸筋共同運動6・共同運動の混合6・分離運動6・正常反射2）、B手関節10点、C手14点、D協調性・速さ6点。" },
{ id:"s7-05", cat:"s7", q:"FMA上肢Aの「V 正常反射」を採点する条件はどれか。",
  c:["IV（分離運動）が満点（6点）のとき","常に採点する","IIが満点のとき","IIIが満点のとき","反射が消失しているとき"], a:0,
  e:"V正常反射はIV分離運動が満点（6点）のときだけ採点する。IVが満点でないのにVを採点するのは「よくある誤り」。" },
{ id:"s7-06", cat:"s7", q:"FMAの採点方法として正しいのはどれか。",
  c:["0・1・2の3段階で、非麻痺側と比べて判定する","0〜5の6段階で判定する","代償があっても可動域が出れば2点","試行は1回のみ","合計点だけを記録する"], a:0,
  e:"0：できない、1：一部できる、2：完全にできる。必ず非麻痺側と比べる。デモで課題を示し最大3回まで試行し、最もよい試行で採点。下位項目の点も残す。" },
{ id:"s7-07", cat:"s7", q:"FMA上肢Cの握りで「鉛筆」を使うのはどれか。",
  c:["対向つまみ","鉤形握り","横つまみ","円筒握り","球握り"], a:0,
  e:"C手：集団屈曲・集団伸展、a鉤形握り、b横つまみ（紙）、c対向つまみ（鉛筆）、d円筒握り（缶）、e球握り（ボール）。" },
{ id:"s7-08", cat:"s7", q:"FMA上肢Cの握りで「缶」を使うのはどれか。",
  c:["円筒握り","横つまみ","対向つまみ","球握り","鉤形握り"], a:0,
  e:"d円筒握りで缶、b横つまみで紙、c対向つまみで鉛筆、e球握りでボールを使う。" },
{ id:"s7-09", cat:"s7", q:"FMA上肢D（協調性・速さ）の指鼻試験で、非麻痺側との時間差が2〜5秒のときの点数はどれか。",
  c:["1点","0点","2点","3点","採点しない"], a:0,
  e:"指鼻試験を閉眼で速く5回。振戦・測定障害：著明0／軽度1／なし2。時間差：6秒以上0／2〜5秒1／2秒未満2。" },
{ id:"s7-10", cat:"s7", q:"FMA下肢Eの「伸筋共同運動」を評価する肢位はどれか。",
  c:["側臥位","背臥位","座位","立位","腹臥位"], a:0,
  e:"下肢E：反射（背臥位）、屈筋共同運動（背臥位）、伸筋共同運動（側臥位：股伸展・内転、膝伸展、足底屈に抵抗）、共同運動の混合（座位）、分離運動（立位）。" },
{ id:"s7-11", cat:"s7", q:"FMA下肢Eの「IV 分離運動」の課題はどれか。",
  c:["立位で股伸展位での膝屈曲、足関節背屈","座位で膝屈曲90°以上、足関節背屈","背臥位で股屈曲・膝屈曲・足背屈","側臥位で股伸展・内転、膝伸展","背臥位で踵膝試験"], a:0,
  e:"下肢IV分離運動は立位で股伸展位での膝屈曲と足関節背屈。III共同運動の混合は座位で膝屈曲90°以上と足関節背屈。" },
{ id:"s7-12", cat:"s7", q:"FMA下肢Fの協調性・速さで用いる検査はどれか。",
  c:["踵膝試験を速く5回","指鼻試験を閉眼で5回","10m歩行","片脚立位","振り子運動検査"], a:0,
  e:"下肢Fは背臥位で踵膝試験を速く5回行い、振戦・測定障害・時間差を採点（6点）。" },
{ id:"s7-13", cat:"s7", q:"FMAで「1点」と採点する目安として正しいのはどれか。",
  c:["可動域が非麻痺側より明らかに小さい","動きの質が非麻痺側と同程度で全可動域","全く動かない","代償を使って全可動域動く","非麻痺側と比べずに十分動く"], a:0,
  e:"可動域が非麻痺側より明らかに小さい→1、できるが保持・反復が不十分→1、動きの質が同程度で全可動域→2。" },
{ id:"s7-14", cat:"s7", q:"FMA採点の「よくある誤り」はどれか。",
  c:["代償（体幹の傾き）があっても2点にする","非麻痺側と比べる","最もよい試行で採点する","口頭指示を統一する","下位項目の点も残す"], a:0,
  e:"よくある誤り：IVが満点でないのにVを採点、代償（体幹の傾き）を2点にする、肢位をそろえない。" },
{ id:"s7-15", cat:"s7", q:"FMAとBRSの関係として正しいのはどれか。",
  c:["FMAの項目はBRSの回復段階の順に並び、より細かい変化をとらえられる","FMAはBRSと無関係な検査である","FMAはBRSより粗い評価である","FMAは研究では使われない","FMAは下肢のみの評価である"], a:0,
  e:"FMAは反射→共同運動→共同運動の混合→分離運動の順に並び、BRSより細かい変化をとらえられる。研究や効果判定で世界的に使われる。" },
{ id:"s7-16", cat:"s7", q:"FMA上肢B（手関節）に含まれる項目はどれか。",
  c:["肘90°屈曲位で背屈15°保持","鉤形握り","指鼻試験","手を腰椎部へ","前腕回外"], a:0,
  e:"B手関節（10点）：肘90°屈曲位で背屈15°保持、肘90°で掌屈・背屈の反復、肘伸展位で背屈15°保持、肘伸展位で掌屈・背屈の反復、分回し運動。" },
{ id:"s7-17", cat:"s7", q:"FMA上肢Aの「III 共同運動の混合」の課題はどれか。",
  c:["手を腰椎部へ、肩屈曲0〜90°、肘90°で回内・回外","手を耳へ","手を反対側の膝へ","肩外転0〜90°、肩屈曲90〜180°","肘伸展位で回内・回外"], a:0,
  e:"III共同運動の混合：手を腰椎部へ、肩屈曲0〜90°、肘90°で回内・回外（BRS IVの課題に相当）。IV分離運動：肩外転0〜90°、肩屈曲90〜180°、肘伸展位で回内・回外（BRS Vに相当）。" },

/* ===================== 病態理解・横断的思考 ===================== */
{ id:"x-01", cat:"x", q:"痙縮が「速く伸ばすほど抵抗が強くなる（速度依存性）」ことを、第1回の筋紡錘の知識で説明すると最も適切なのはどれか。",
  c:["急速な伸張（速度）を伝えるIa線維を介した伸張反射が亢進しているため","腱紡錘のIb線維による自己抑制が亢進しているため","錐体外路の障害で緊張性伸張反射が亢進しているため","筋そのものが短縮しているため","相反神経支配が正常に働いているため"], a:0,
  e:"筋紡錘のIa線維は伸張の速度に反応し、伸張反射（単シナプス）を起こす。上位中枢の抑制が外れてこの反射が亢進した状態が痙縮で、速く伸ばすほど抵抗が強い。長さ依存の緊張性伸張反射の亢進は固縮の説明。" },

/* ========= 保存（localStorage／使えない環境ではメモリで代用） ========= */
const STORE_KEY = "tpu_eval2_s1-7_v1";
let memStore = {};
const storage = {
  load(){ try{ const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : {}; }catch(e){ return memStore; } },
  save(h){ memStore = h; try{ localStorage.setItem(STORE_KEY, JSON.stringify(h)); }catch(e){} }
};
let history = storage.load();   // { id: {seen, correct, wrong, last:"ok"|"ng"} }

const CAT_MAP = Object.fromEntries(CATS.map(c => [c.key, c]));
const app = document.getElementById("app");
const LABELS = ["A","B","C","D","E"];

const state = { mode:"all", selected:new Set(CATS.map(c=>c.key)), count:"all", list:[], current:0, answers:[], score:0 };

/* ========= ユーティリティ ========= */
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function isWeak(id){ const h = history[id]; return !!(h && h.last === "ng"); }
function weakList(){ return QUESTIONS.filter(q => isWeak(q.id)); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function confirmModal(title, body, okLabel, onOk){
  const ov = document.createElement("div"); ov.className="overlay";
  ov.innerHTML = `<div class="modal"><h3>${title}</h3><p>${body}</p><div class="btns"><button class="btn btn-ghost" data-x="cancel">キャンセル</button><button class="btn btn-danger" data-x="ok">${okLabel}</button></div></div>`;
  ov.addEventListener("click", e => {
    const x = e.target.getAttribute("data-x");
    if (x === "ok"){ ov.remove(); onOk(); }
    else if (x === "cancel" || e.target === ov){ ov.remove(); }
  });
  document.body.appendChild(ov);
}

/* ========= ホーム ========= */
function renderHome(){
  const seen = QUESTIONS.filter(q => history[q.id]).length;
  const mastered = QUESTIONS.filter(q => history[q.id] && history[q.id].last === "ok").length;
  const weak = weakList().length;
  const poolCount = QUESTIONS.filter(q => state.selected.has(q.cat)).length;

  app.innerHTML = `
    <section class="card">
      <h2 class="sec">学習状況</h2>
      <div class="stats">
        <div class="stat"><div class="num">${seen}<span style="font-size:13px;color:var(--ink-mute)"> / ${QUESTIONS.length}</span></div><div class="lbl">学習済み</div></div>
        <div class="stat master"><div class="num">${mastered}</div><div class="lbl">直近で正解</div></div>
        <div class="stat weak"><div class="num">${weak}</div><div class="lbl">苦手問題</div></div>
      </div>
    </section>

    <section class="card">
      <h2 class="sec">出題範囲を選ぶ</h2>
      <div class="row-btns">
        <button class="mini-link" id="selAll">すべて選択</button>
        <button class="mini-link" id="selNone">すべて解除</button>
      </div>
      <div class="chips" id="chips">
        ${CATS.map(c => `<button class="chip ${state.selected.has(c.key)?"on":""}" data-k="${c.key}">${c.label}<span class="n">${QUESTIONS.filter(q=>q.cat===c.key).length}問</span></button>`).join("")}
      </div>
      <div class="select-row">出題数：
        <select id="countSel">
          <option value="all" ${state.count==="all"?"selected":""}>選んだ範囲すべて</option>
          <option value="10" ${state.count==="10"?"selected":""}>10問</option>
          <option value="20" ${state.count==="20"?"selected":""}>20問</option>
          <option value="30" ${state.count==="30"?"selected":""}>30問</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="startAll" ${poolCount===0?"disabled":""}>
        選んだ範囲に挑戦（${poolCount}問から）
        <span class="btn-sub">問題順・選択肢順はランダムに並びます</span>
      </button>
      <button class="btn btn-gold btn-block" id="startWeak" ${weak===0?"disabled":""}>
        苦手問題だけに挑戦（${weak}問）
        <span class="btn-sub">直近で間違えた問題。正解すると苦手リストから外れます</span>
      </button>
      <button class="btn btn-ghost btn-block" id="openWeak">苦手問題リストを見る</button>
      <p class="note">苦手問題モードは出題範囲の選択に関係なく、全範囲の苦手問題から出題します。<br>
      <button class="mini-link" id="resetBtn" style="padding:0">学習履歴をリセット</button></p>
    </section>
  `;

  document.getElementById("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    const k = b.getAttribute("data-k");
    state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k);
    renderHome();
  });
  document.getElementById("selAll").onclick = () => { state.selected = new Set(CATS.map(c=>c.key)); renderHome(); };
  document.getElementById("selNone").onclick = () => { state.selected = new Set(); renderHome(); };
  document.getElementById("countSel").onchange = e => { state.count = e.target.value; };
  document.getElementById("startAll").onclick = () => startQuiz("all");
  document.getElementById("startWeak").onclick = () => startQuiz("weak");
  document.getElementById("openWeak").onclick = renderWeakList;
  document.getElementById("resetBtn").onclick = () => confirmModal("学習履歴をリセット", "これまでの正誤記録と苦手問題がすべて消えます。よろしいですか？", "リセット", () => { history = {}; storage.save(history); renderHome(); toast("学習履歴をリセットしました"); });
  window.scrollTo(0,0);
}

/* ========= 出題 ========= */
function startQuiz(mode){
  let pool = mode === "weak" ? weakList() : QUESTIONS.filter(q => state.selected.has(q.cat));
  pool = shuffle(pool);
  if (mode === "all" && state.count !== "all") pool = pool.slice(0, Number(state.count));
  if (pool.length === 0){ toast("出題できる問題がありません"); return; }
  state.mode = mode;
  state.list = pool.map(q => ({ q, order: shuffle([0,1,2,3,4]) }));
  state.current = 0; state.answers = new Array(pool.length).fill(null); state.score = 0;
  renderQuestion();
}

function renderQuestion(){
  const total = state.list.length;
  const item = state.list[state.current];
  const q = item.q;
  const cat = CAT_MAP[q.cat];
  const answered = state.answers[state.current];
  const answeredCount = state.answers.filter(a => a !== null).length;
  const isWeakMode = state.mode === "weak";

  app.innerHTML = `
    <section class="card">
      <div class="topbar">
        <button class="back-btn" id="quizHomeBtn">← ホームに戻る</button>
        ${isWeakMode ? `<span class="mode-flag">苦手問題モード</span>` : ``}
      </div>
      <div class="quiz-meta">
        <span class="qnum">問題 ${state.current+1} / ${total}</span>
        <span class="catbadge ${cat.cls}">${cat.label}</span>
      </div>
      <div class="progress-track"><div class="progress-fill ${isWeakMode?"is-weak":""}" style="width:${(state.current/total*100)}%"></div></div>
      <p class="question-text">${esc(q.q)}</p>
      <div class="choices" id="choices"></div>
      <div id="explanation"></div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="prevBtn" ${state.current===0?"disabled":""}>← 前へ</button>
        <span class="score-mini">正解 ${state.score} / ${answeredCount}</span>
        <button class="btn btn-primary" id="nextBtn">${state.current===total-1?"結果を見る":"次へ →"}</button>
      </div>
    </section>`;

  // ホームボタンは最初に登録（以降の描画で例外が起きても必ず効くように）
  document.getElementById("quizHomeBtn").addEventListener("click", () => { recordSession(); renderHome(); });

  const box = document.getElementById("choices");
  item.order.forEach((orig, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="lab">${LABELS[i]}</span><span>${esc(q.c[orig])}</span>`;
    if (answered !== null){
      b.disabled = true;
      if (orig === q.a) b.classList.add("correct");
      else if (orig === answered) b.classList.add("wrong");
    } else {
      b.addEventListener("click", () => handleAnswer(orig));
    }
    box.appendChild(b);
  });

  if (answered !== null){
    const ok = answered === q.a;
    document.getElementById("explanation").innerHTML = `
      <div class="explain">
        <p class="verdict ${ok?"ok":"bad"}">${ok?"正解！":"不正解"}　正答：${esc(q.c[q.a])}</p>
        <p>${esc(q.e)}</p>
      </div>`;
  }

  document.getElementById("prevBtn").onclick = () => { if(state.current>0){ state.current--; renderQuestion(); } };
  document.getElementById("nextBtn").onclick = () => {
    if (state.current < total-1){ state.current++; renderQuestion(); window.scrollTo(0,0); }
    else { renderResult(); }
  };
}

function handleAnswer(orig){
  const q = state.list[state.current].q;
  state.answers[state.current] = orig;
  if (orig === q.a) state.score++;
  // その場で履歴に反映（途中離脱しても記録が残る）
  const h = history[q.id] || { seen:0, correct:0, wrong:0, last:null };
  h.seen++; if (orig === q.a){ h.correct++; h.last="ok"; } else { h.wrong++; h.last="ng"; }
  history[q.id] = h; storage.save(history);
  renderQuestion();
}
function recordSession(){ /* 解答ごとに保存済みのため処理なし（拡張用） */ }

/* ========= 結果 ========= */
function renderResult(){
  const total = state.list.length;
  const answered = state.answers.filter(a=>a!==null).length;
  const pct = answered ? Math.round(state.score/answered*100) : 0;
  const byCat = {};
  state.list.forEach((it,i) => {
    const k = it.q.cat; byCat[k] = byCat[k] || {n:0, ok:0};
    if (state.answers[i] !== null){ byCat[k].n++; if (state.answers[i] === it.q.a) byCat[k].ok++; }
  });
  const wrongs = state.list.filter((it,i) => state.answers[i] !== null && state.answers[i] !== it.q.a);

  app.innerHTML = `
    <section class="card">
      <div class="result-hero">
        <div class="sub">${state.mode==="weak"?"苦手問題モード":"今回の結果"}</div>
        <div class="big">${pct}%</div>
        <div class="sub">正解 ${state.score} / 解答 ${answered}（全${total}問）・現在の苦手問題 ${weakList().length}問</div>
      </div>
      <div class="bars">
        <h2 class="sec" style="margin-top:6px">回ごとの正答率</h2>
        ${CATS.filter(c=>byCat[c.key] && byCat[c.key].n>0).map(c => {
          const r = Math.round(byCat[c.key].ok/byCat[c.key].n*100);
          const col = r>=80 ? "var(--ok-line)" : r>=60 ? "var(--gold-500)" : "var(--bad-line)";
          return `<div class="bar-row"><div class="bar-head"><span>${c.label}</span><span>${byCat[c.key].ok}/${byCat[c.key].n}（${r}%）</span></div><div class="bar-track"><div class="bar-fill" style="width:${r}%;background:${col}"></div></div></div>`;
        }).join("") || `<p class="empty">解答した問題がありません</p>`}
      </div>
      <button class="btn btn-primary btn-block" id="retry">もう一度挑戦</button>
      <button class="btn btn-gold btn-block" id="toWeak" ${weakList().length===0?"disabled":""}>苦手問題だけに挑戦</button>
      <button class="btn btn-ghost btn-block" id="home">ホームに戻る</button>
    </section>
    <section class="card">
      <h2 class="sec">間違えた問題の見直し（${wrongs.length}問）</h2>
      ${wrongs.length ? wrongs.map(it => `
        <div class="review-item">
          <div class="ri-meta"><span class="catbadge ${CAT_MAP[it.q.cat].cls}">${CAT_MAP[it.q.cat].short}</span></div>
          <p class="ri-q">${esc(it.q.q)}</p>
          <p class="ri-a">正答：${esc(it.q.c[it.q.a])}</p>
          <p class="ri-exp">${esc(it.q.e)}</p>
        </div>`).join("") : `<p class="empty">間違えた問題はありません。</p>`}
    </section>`;
  document.getElementById("home").onclick = renderHome;
  document.getElementById("retry").onclick = () => startQuiz(state.mode);
  document.getElementById("toWeak").onclick = () => startQuiz("weak");
  window.scrollTo(0,0);
}

/* ========= 苦手問題リスト ========= */
function renderWeakList(){
  const list = weakList().sort((a,b) => (history[b.id].wrong - history[a.id].wrong));
  app.innerHTML = `
    <section class="card">
      <div class="topbar"><button class="back-btn" id="wlHome">← ホームに戻る</button><span class="mode-flag">苦手 ${list.length}問</span></div>
      <h2 class="sec">苦手問題リスト（誤答回数の多い順）</h2>
      ${list.length ? list.map(q => `
        <div class="review-item">
          <div class="ri-meta"><span class="catbadge ${CAT_MAP[q.cat].cls}">${CAT_MAP[q.cat].short}</span><span class="miss">誤答 ${history[q.id].wrong}回 / 解答 ${history[q.id].seen}回</span></div>
          <p class="ri-q">${esc(q.q)}</p>
          <details><summary>正答と解説を見る</summary>
            <p class="ri-a" style="margin-top:6px">正答：${esc(q.c[q.a])}</p>
            <p class="ri-exp">${esc(q.e)}</p>
          </details>
        </div>`).join("") : `<p class="empty">苦手問題はありません。</p>`}
      ${list.length ? `<button class="btn btn-gold btn-block" id="wlStart">この${list.length}問に挑戦</button>` : ``}
    </section>`;
  document.getElementById("wlHome").onclick = renderHome;
  const s = document.getElementById("wlStart"); if (s) s.onclick = () => startQuiz("weak");
  window.scrollTo(0,0);
}

renderHome();
</script>
